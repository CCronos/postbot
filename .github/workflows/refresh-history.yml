# Ciclo LENTO: re-descarga el historial completo de las 9 cuentas y
# recalibra la sobre-dispersion (backtest.py). Cada 6 horas - el patron de
# "cuando postea" no cambia en minutos, no tiene sentido pegarle a la API de
# xtracker con esto cada 5 min como el ciclo rapido (deploy.yml).
#
# Deja data/summary.json, data/daily_summary.json y data/backtest_results.json
# commiteados en el repo (livianos, sin el texto de los posts) para que el
# ciclo rapido los lea sin tener que re-descargar nada.

name: refresh-history

on:
  schedule:
    - cron: "17 */6 * * *"  # minuto 17 para no chocar con el ciclo rapido en el 0
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: chatter-refresh-history
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar historial completo de posts (xtracker)
        run: python download_history.py

      - name: Backtest (mide sobre-dispersion real por cuenta)
        run: python backtest.py

      - name: Commit de summary.json / daily_summary.json / backtest_results.json
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json data/daily_summary.json data/backtest_results.json
          if git diff --cached --quiet; then
            echo "sin cambios que commitear"
          else
            git commit -m "refresh-history: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push origin main
          fi

# Ciclo RAPIDO: conteo en vivo + precios reales de Polymarket + rebuild del
# dashboard. Cada 5 minutos. NO descarga el historial completo (eso lo hace
# refresh-history.yml cada 6h) - solo lee data/summary.json y
# data/daily_summary.json, que ya estan commiteados en el repo.
#
# Secrets requeridos: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: deploy

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chatter-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot en vivo + EV/Kelly contra Polymarket
        run: python live_snapshot.py

      - name: Construir dashboard
        run: python build_dashboard.py

      - name: Deploy a Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create chatter-postbot --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy dist --project-name=chatter-postbot --branch=main

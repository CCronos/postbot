# CHATTER — corre el pipeline completo (descarga historial, backtest,
# snapshot en vivo, build) y publica el dashboard en Cloudflare Pages.
# Nada de esto depende de la laptop del usuario.
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token de Cloudflare con permiso "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  el Account ID del dashboard de Cloudflare
#
# Repo 100% separado de weatherbot a proposito (pedido del usuario 2026-08-06).

name: deploy

on:
  schedule:
    - cron: "0 * * * *"  # cada hora (UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: chatter-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar historial de posts (xtracker)
        run: python download_history.py

      - name: Backtest (mide sobre-dispersion real por cuenta)
        run: python backtest.py

      - name: Snapshot en vivo + EV/Kelly contra Polymarket
        run: python live_snapshot.py

      - name: Construir dashboard
        run: python build_dashboard.py

      - name: Deploy a Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create chatter-postbot --production-branch=main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy dist --project-name=chatter-postbot --branch=main
